name: Prueba en la nube

on:
  workflow_dispatch:
  push:

jobs:
  prueba-compatibilidad:
    strategy:
      matrix:
        sistema:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.sistema }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pytest
        run: pip install pytest

      - name: Ejecutar prueba en la nube
        run: pytest tests/test_notificaciones.py -v
